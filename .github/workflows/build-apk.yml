name: Build Android APK (Shock)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permissions
        working-directory: ./android
        run: |
          chmod +x ./build.gradle || true

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Deploy APK to Docs for GitHub Pages Download
        run: |
          mkdir -p docs/downloads
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/downloads/Shock.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Shock.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shock-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit Generated APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Shock.apk public/downloads/Shock.apk || true
          git commit -m "chore(release): automated Shock.apk build [skip ci]" || true
          git push || true
