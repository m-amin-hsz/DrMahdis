name: Build Android APK (Shock)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a533e444061824108e12986a752" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Deploy APK to Docs for GitHub Pages Download
        run: |
          mkdir -p docs/downloads
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk docs/downloads/Shock.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/Shock.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shock-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit Generated APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Shock.apk public/downloads/Shock.apk || true
          if git diff --staged --quiet; then
            echo "No changes in Shock.apk"
          else
            git commit -m "chore(release): automated Shock.apk build [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
